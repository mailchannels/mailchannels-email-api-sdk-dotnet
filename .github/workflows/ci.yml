name: .NET SDK validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            image: mcr.microsoft.com/dotnet/sdk@sha256:ec9c0a0dc5f60adc2065762050638dd5ed5facfc53716d4580a42d86027c8e80
          - framework: net9.0
            image: mcr.microsoft.com/dotnet/sdk@sha256:1330d3c4144aec2695036a125d9a3b49a1fc555c9024c981248fa83d40fa8b23
          - framework: net10.0
            image: mcr.microsoft.com/dotnet/sdk@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash scripts/test.sh
        env:
          SDK_DOTNET_IMAGE: ${{ matrix.image }}
          SDK_PROBE_FRAMEWORK: ${{ matrix.framework }}
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.3
      - run: bash scripts/regenerate.sh && git diff --exit-code
      - run: bash scripts/pack.sh
      - run: bash scripts/audit.sh > artifacts/audit.json
      - run: python scripts/check-audit.py artifacts/audit.json
      - run: bash scripts/build-example.sh
