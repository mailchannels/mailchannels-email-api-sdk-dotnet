name: .NET SDK validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    name: Native ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        framework: [net8.0, net9.0, net10.0]
        include:
          - framework: net8.0
            sdk: 8.0.x
          - framework: net9.0
            sdk: 9.0.x
          - framework: net10.0
            sdk: 10.0.x
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        id: dotnet
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Select installed SDK and record native platform
        env:
          SELECTED_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          python -c 'import json,os; open("global.json", "w").write(json.dumps({"sdk":{"version":os.environ["SELECTED_SDK"],"rollForward":"disable"}}))'
          dotnet --info
      - name: Restore locked dependencies and run native fixtures
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          dotnet restore tests/Probe.csproj --locked-mode -p:ProbeFramework=${{ matrix.framework }}
          dotnet run --project tests/Probe.csproj --no-restore --configuration Release -p:ProbeFramework=${{ matrix.framework }}
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            image: mcr.microsoft.com/dotnet/sdk@sha256:ec9c0a0dc5f60adc2065762050638dd5ed5facfc53716d4580a42d86027c8e80
          - framework: net9.0
            image: mcr.microsoft.com/dotnet/sdk@sha256:1330d3c4144aec2695036a125d9a3b49a1fc555c9024c981248fa83d40fa8b23
          - framework: net10.0
            image: mcr.microsoft.com/dotnet/sdk@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash scripts/test.sh
        env:
          SDK_DOTNET_IMAGE: ${{ matrix.image }}
          SDK_PROBE_FRAMEWORK: ${{ matrix.framework }}
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.3
      - run: bash scripts/regenerate.sh && git diff --exit-code
      - run: bash scripts/pack.sh
      - run: |
          bash scripts/audit.sh > "$RUNNER_TEMP/audit.json"
          python scripts/check-audit.py "$RUNNER_TEMP/audit.json"
      - run: bash scripts/build-example.sh
